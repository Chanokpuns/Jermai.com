services:
  db:
    image: mysql:8.0
    container_name: jermai-db
    restart: unless-stopped
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: Test1234
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./server/src/models/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-pTest1234"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  db_data:
